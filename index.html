<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Atom Model</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    /* ป้ายข้อความบอกสถานะด้านบน */
    #status-msg {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      color: #00e5ff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      pointer-events: none;
      z-index: 1000;
    }
    /* กล่องข้อมูลที่จะแสดงเวลาเอานิ้วแตะชิ้นส่วน */
    #info-card {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 360px;
      background: rgba(15, 15, 20, 0.9);
      backdrop-filter: blur(10px);
      color: #ffffff;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 1000;
      box-sizing: border-box;
      border: 1px solid rgba(0, 229, 255, 0.3);
    }
    #info-card h3 {
      margin: 0 0 6px 0;
      color: #00e5ff;
    }
    #info-card p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: #e0e0e0;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status-msg">แตะที่ส่วนต่างๆ ของอะตอมเพื่อดูข้อมูล</div>

  <div id="info-card">
    <h3 id="card-title">หัวข้อ</h3>
    <p id="card-desc">รายละเอียดข้อมูลส่วนประกอบ</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    let camera, scene, renderer;
    let controller;
    let atomGroup;
    let electronOrbits = [];
    const interactiveObjects = [];

    const raycaster = new THREE.Raycaster();
    const infoCard = document.getElementById('info-card');
    const cardTitle = document.getElementById('card-title');
    const cardDesc = document.getElementById('card-desc');

    init();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      // แสงสว่าง
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2.5);
      hemiLight.position.set(0, 2, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight.position.set(1, 2, 1);
      scene.add(dirLight);

      // สร้าง Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // สร้างปุ่มเข้าสู่โหมด AR
      document.body.appendChild(ARButton.createButton(renderer, {
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.body }
      }));

      // วางโมเดลอะตอมไว้ตรงหน้าทันที (แกน Z = -0.6 เมตร คือห่างไปข้างหน้า 60 ซม.)
      atomGroup = createAtomModel();
      atomGroup.position.set(0, 0, -0.6);
      scene.add(atomGroup);

      // การแตะหน้าจอเพื่อยิง Raycast ตรวจจับชิ้นส่วน
      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      window.addEventListener('resize', onWindowResize);
      renderer.setAnimationLoop(render);
    }

    function createAtomModel() {
      const group = new THREE.Group();

      // 1. นิวเคลียส (ลูกกลมสีแดงตรงกลาง)
      const nucleusGeo = new THREE.SphereGeometry(0.06, 32, 32);
      const nucleusMat = new THREE.MeshStandardMaterial({
        color: 0xff3b30,
        roughness: 0.3,
        metalness: 0.2
      });
      const nucleus = new THREE.Mesh(nucleusGeo, nucleusMat);
      nucleus.userData = {
        title: 'นิวเคลียส (Nucleus)',
        desc: 'ใจกลางของอะตอม ประกอบด้วยโปรตอนและนิวตรอน ยึดเหนี่ยวกันด้วยแรงนิวเคลียร์อย่างเข้ม'
      };
      group.add(nucleus);
      interactiveObjects.push(nucleus);

      // 2. วงโคจรและเม็ดอิเล็กตรอน (สีฟ้า)
      const orbitRadii = [0.18, 0.24, 0.30];
      const orbitAngles = [
        [0, 0, 0],
        [Math.PI / 3, Math.PI / 4, 0],
        [-Math.PI / 3, -Math.PI / 4, 0]
      ];

      orbitRadii.forEach((radius, i) => {
        const orbitPivot = new THREE.Group();
        orbitPivot.rotation.set(...orbitAngles[i]);

        // วงแหวนทางโคจร
        const ringGeo = new THREE.TorusGeometry(radius, 0.002, 16, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.4 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        orbitPivot.add(ring);

        // เม็ดอิเล็กตรอน
        const electronGeo = new THREE.SphereGeometry(0.02, 16, 16);
        const electronMat = new THREE.MeshStandardMaterial({
          color: 0x00e5ff,
          emissive: 0x00e5ff,
          emissiveIntensity: 0.8
        });
        const electron = new THREE.Mesh(electronGeo, electronMat);
        electron.position.x = radius;
        electron.userData = {
          title: 'อิเล็กตรอน (Electron)',
          desc: 'อนุภาคมีประจุไฟฟ้าเป็นลบ เคลื่อนที่รอบนิวเคลียสด้วยความเร็วสูงมาก'
        };

        orbitPivot.add(electron);
        group.add(orbitPivot);

        interactiveObjects.push(electron);
        electronOrbits.push({ pivot: orbitPivot, speed: 1.2 + i * 0.5 });
      });

      return group;
    }

    // เมื่อเอานิ้วแตะหน้าจอเพื่อเลือกชิ้นส่วน
    function onSelect() {
      const tempMatrix = new THREE.Matrix4();
      tempMatrix.identity().extractRotation(controller.matrixWorld);

      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

      const intersects = raycaster.intersectObjects(interactiveObjects, true);

      if (intersects.length > 0) {
        const clicked = intersects[0].object;
        showInfo(clicked.userData.title, clicked.userData.desc);
      } else {
        hideInfo();
      }
    }

    function showInfo(title, desc) {
      cardTitle.innerText = title;
      cardDesc.innerText = desc;
      infoCard.style.display = 'block';
    }

    function hideInfo() {
      infoCard.style.display = 'none';
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function render() {
      // ให้อิเล็กตรอนวิ่งรอบนิวเคลียสตลอดเวลา
      electronOrbits.forEach((orbit) => {
        orbit.pivot.rotation.y += 0.015 * orbit.speed;
      });

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
