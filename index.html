<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Atom Model</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    /* กล่องข้อมูลอธิบายที่จะแสดงตอนเอานิ้วจิ้ม */
    #info-card {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 360px;
      background: rgba(20, 20, 25, 0.85);
      backdrop-filter: blur(10px);
      color: #ffffff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 1000;
      box-sizing: border-box;
    }
    #info-card h3 {
      margin: 0 0 6px 0;
      color: #00e5ff;
    }
    #info-card p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: #e0e0e0;
    }
  </style>

  <!-- Import maps สำหรับโหลด Three.js และโมดูลเสริม -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- การ์ดแสดงข้อมูลเมื่อแตะชิ้นส่วน -->
  <div id="info-card">
    <h3 id="card-title">หัวข้อ</h3>
    <p id="card-desc">รายละเอียดข้อมูลส่วนประกอบของอะตอม</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    let camera, scene, renderer;
    let controller;
    let reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;

    let atomGroup = null;
    let electronOrbits = [];
    const interactiveObjects = [];

    const raycaster = new THREE.Raycaster();
    const infoCard = document.getElementById('info-card');
    const cardTitle = document.getElementById('card-title');
    const cardDesc = document.getElementById('card-desc');

    init();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      // แสงสว่างในฉาก
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
      hemiLight.position.set(0, 2, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight.position.set(1, 2, 1);
      scene.add(dirLight);

      // WebGL Renderer รองรับ WebXR
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // สร้างปุ่มเข้าสู่ AR พร้อมเปิดฟีเจอร์ Hit-Test และ DOM Overlay
      document.body.appendChild(ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.body }
      }));

      // วงแหวนเล็งตำแหน่งบนโต๊ะ (Reticle)
      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x00ffcc })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // ตัวจัดการอีเวนต์แตะหน้าจอผ่าน XR Controller
      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      window.addEventListener('resize', onWindowResize);
      renderer.setAnimationLoop(render);
    }

    // ฟังก์ชันสร้างโมเดลอะตอมด้วยโค้ด Three.js
    function createAtomModel() {
      const group = new THREE.Group();

      // 1. นิวเคลียส (Nucleus) - ก้อนตรงกลาง
      const nucleusGeo = new THREE.SphereGeometry(0.04, 32, 32);
      const nucleusMat = new THREE.MeshStandardMaterial({
        color: 0xff3b30,
        roughness: 0.3,
        metalness: 0.2
      });
      const nucleus = new THREE.Mesh(nucleusGeo, nucleusMat);
      nucleus.userData = {
        title: 'นิวเคลียส (Nucleus)',
        desc: 'ใจกลางของอะตอม ประกอบด้วยโปรตอน (ประจุบวก) และนิวตรอน (ไม่มีประจุ) รวมกันเป็นมวลเกือบทั้งหมดของอะตอม'
      };
      group.add(nucleus);
      interactiveObjects.push(nucleus);

      // 2. วงโคจรและอิเล็กตรอน (3 วงแกนต่างกัน)
      const orbitRadii = [0.12, 0.16, 0.20];
      const orbitRotations = [
        [0, 0, 0],
        [Math.PI / 3, Math.PI / 4, 0],
        [-Math.PI / 3, -Math.PI / 4, 0]
      ];

      orbitRadii.forEach((radius, i) => {
        const orbitPivot = new THREE.Group();
        orbitPivot.rotation.set(...orbitRotations[i]);

        // เส้นวงโคจร
        const ringGeo = new THREE.TorusGeometry(radius, 0.0015, 16, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.4 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        orbitPivot.add(ring);

        // เม็ดอิเล็กตรอน
        const electronGeo = new THREE.SphereGeometry(0.015, 16, 16);
        const electronMat = new THREE.MeshStandardMaterial({
          color: 0x00e5ff,
          emissive: 0x00e5ff,
          emissiveIntensity: 0.6
        });
        const electron = new THREE.Mesh(electronGeo, electronMat);
        electron.position.x = radius;
        electron.userData = {
          title: 'อิเล็กตรอน (Electron)',
          desc: 'อนุภาคที่มีประจุไฟฟ้าเป็นลบ เคลื่อนที่รอบนิวเคลียสด้วยระดับพลังงานต่างๆ มีมวลน้อยมาก'
        };

        orbitPivot.add(electron);
        group.add(orbitPivot);

        interactiveObjects.push(electron);
        electronOrbits.push({ pivot: orbitPivot, speed: 1.5 + i * 0.7 });
      });

      return group;
    }

    // เมื่อเอานิ้วแตะหน้าจอ
    function onSelect() {
      // 1. ถ้ายังไม่ได้วางโมเดล และกล้องจับระนาบโต๊ะได้ ให้ทำการวางโมเดล
      if (!atomGroup && reticle.visible) {
        atomGroup = createAtomModel();
        reticle.matrix.decompose(atomGroup.position, atomGroup.quaternion, atomGroup.scale);
        scene.add(atomGroup);
        reticle.visible = false;
        return;
      }

      // 2. ถ้าวางโมเดลแล้ว ให้ยิง Raycaster ตรวจจับว่าแตะโดนชิ้นส่วนไหน
      if (atomGroup) {
        // ใช้ทิศทางของคอนโทรลเลอร์สมาร์ตโฟน
        const tempMatrix = new THREE.Matrix4();
        tempMatrix.identity().extractRotation(controller.matrixWorld);

        raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

        const intersects = raycaster.intersectObjects(interactiveObjects, true);

        if (intersects.length > 0) {
          const clicked = intersects[0].object;
          showInfo(clicked.userData.title, clicked.userData.desc);
        } else {
          hideInfo();
        }
      }
    }

    function showInfo(title, desc) {
      cardTitle.innerText = title;
      cardDesc.innerText = desc;
      infoCard.style.display = 'block';
    }

    function hideInfo() {
      infoCard.style.display = 'none';
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Render Loop สำหรับแอนิเมชันและการตรวจจับระนาบ
    function render(timestamp, frame) {
      // แอนิเมชันหมุนอิเล็กตรอนรอบนิวเคลียส
      electronOrbits.forEach((orbit) => {
        orbit.pivot.rotation.y += 0.015 * orbit.speed;
      });

      // ตรวจสอบ Hit-Test หาพื้นผิวโต๊ะ
      if (frame && !atomGroup) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = frame.session;

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            session.requestHitTestSource({ space: viewerSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
