<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Atom Model</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    /* คอนเทนเนอร์ปุ่มควบคุมและ UI ซ้อนทับในโหมด AR */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* เพื่อให้จิ้มทะลุไปแตะ 3D ได้ */
      z-index: 1000;
    }
    /* ปุ่มกดสร้างโมเดลอะตอมตรงหน้า */
    #spawn-btn {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #00e5ff;
      color: #050b14;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      pointer-events: auto; /* ให้กดปุ่มได้ */
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
      cursor: pointer;
    }
    #spawn-btn:active {
      transform: translateX(-50%) scale(0.95);
    }
    /* กล่องข้อมูลอธิบายชิ้นส่วน */
    #info-card {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 360px;
      background: rgba(15, 15, 20, 0.92);
      backdrop-filter: blur(10px);
      color: #ffffff;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      display: none;
      pointer-events: auto;
      box-sizing: border-box;
      border: 1px solid rgba(0, 229, 255, 0.4);
    }
    #info-card h3 {
      margin: 0 0 6px 0;
      color: #00e5ff;
      font-size: 18px;
    }
    #info-card p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: #e0e0e0;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <button id="spawn-btn">⚛️ วางอะตอมตรงนี้</button>

    <div id="info-card">
      <h3 id="card-title">หัวข้อ</h3>
      <p id="card-desc">รายละเอียดข้อมูลส่วนประกอบ</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    let camera, scene, renderer;
    let atomGroup = null;
    let electronOrbits = [];
    const interactiveObjects = [];

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const spawnBtn = document.getElementById('spawn-btn');
    const infoCard = document.getElementById('info-card');
    const cardTitle = document.getElementById('card-title');
    const cardDesc = document.getElementById('card-desc');

    init();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      // แสงสว่างรอบทิศทาง
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 3.0);
      hemiLight.position.set(0, 2, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
      dirLight.position.set(1, 2, 1);
      scene.add(dirLight);

      // WebGL Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // ติดตั้งปุ่ม Start AR โดยแนบ Overlay เข้าไปใน WebXR Session
      document.body.appendChild(ARButton.createButton(renderer, {
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.getElementById('overlay') }
      }));

      // กดปุ่มเพื่อสร้าง/ย้ายโมเดลอะตอมมาอยู่ตรงหน้ากล้อง
      spawnBtn.addEventListener('click', spawnAtomInFrontOfCamera);

      // รองรับการเอานิ้วจิ้มบนหน้าจอโดยตรง
      window.addEventListener('pointerdown', onScreenTap);
      window.addEventListener('resize', onWindowResize);

      renderer.setAnimationLoop(render);
    }

    // ฟังก์ชันสร้างและวางโมเดลอะตอมให้อยู่ข้างหน้ากล้อง 50 ซม. ทันที
    function spawnAtomInFrontOfCamera(e) {
      if (e) e.stopPropagation();

      if (!atomGroup) {
        atomGroup = createAtomModel();
        scene.add(atomGroup);
      }

      // คำนวณหาทิศทางข้างหน้าของกล้องในปัจจุบัน
      const dir = new THREE.Vector3(0, 0, -0.5); // ระยะห่าง 50 ซม.
      dir.applyQuaternion(camera.quaternion);

      // ตั้งตำแหน่งอะตอมให้ลอยอยู่ตรงหน้ากล้องพอดี
      atomGroup.position.copy(camera.position).add(dir);
      atomGroup.quaternion.copy(camera.quaternion);

      spawnBtn.innerText = '🔄 ย้ายอะตอมมาตรงหน้า';
    }

    function createAtomModel() {
      const group = new THREE.Group();

      // 1. นิวเคลียสตรงกลาง
      const nucleusGeo = new THREE.SphereGeometry(0.05, 32, 32);
      const nucleusMat = new THREE.MeshStandardMaterial({
        color: 0xff3b30,
        roughness: 0.3,
        metalness: 0.2
      });
      const nucleus = new THREE.Mesh(nucleusGeo, nucleusMat);
      nucleus.userData = {
        title: 'นิวเคลียส (Nucleus)',
        desc: 'ใจกลางของอะตอม ประกอบด้วยโปรตอน (ประจุบวก) และนิวตรอน (ไม่มีประจุ) รวมกันเป็นมวลเกือบทั้งหมด'
      };
      group.add(nucleus);
      interactiveObjects.push(nucleus);

      // 2. วงโคจร 3 วงและอิเล็กตรอนสีฟ้า
      const orbitRadii = [0.12, 0.17, 0.22];
      const orbitAngles = [
        [0, 0, 0],
        [Math.PI / 3, Math.PI / 4, 0],
        [-Math.PI / 3, -Math.PI / 4, 0]
      ];

      orbitRadii.forEach((radius, i) => {
        const orbitPivot = new THREE.Group();
        orbitPivot.rotation.set(...orbitAngles[i]);

        // วงแหวนวิถีโคจร
        const ringGeo = new THREE.TorusGeometry(radius, 0.002, 16, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.5 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        orbitPivot.add(ring);

        // เม็ดอิเล็กตรอน
        const electronGeo = new THREE.SphereGeometry(0.018, 16, 16);
        const electronMat = new THREE.MeshStandardMaterial({
          color: 0x00e5ff,
          emissive: 0x00e5ff,
          emissiveIntensity: 0.8
        });
        const electron = new THREE.Mesh(electronGeo, electronMat);
        electron.position.x = radius;
        electron.userData = {
          title: 'อิเล็กตรอน (Electron)',
          desc: 'อนุภาคที่มีประจุไฟฟ้าเป็นลบ โคจรรอบนิวเคลียสด้วยระดับพลังงานต่างๆ มีมวลน้อยมาก'
        };

        orbitPivot.add(electron);
        group.add(orbitPivot);

        interactiveObjects.push(electron);
        electronOrbits.push({ pivot: orbitPivot, speed: 1.5 + i * 0.6 });
      });

      return group;
    }

    // แตะที่หน้าจอเพื่อเลือกชิ้นส่วน
    function onScreenTap(event) {
      // ถ้ากดโดนปุ่ม Spawn หรือกล่องข้อความ ไม่ต้องรัน Raycaster
      if (event.target.id === 'spawn-btn' || infoCard.contains(event.target)) {
        return;
      }

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects, false);

      if (intersects.length > 0) {
        const item = intersects[0].object;
        showInfo(item.userData.title, item.userData.desc);
      } else {
        hideInfo();
      }
    }

    function showInfo(title, desc) {
      cardTitle.innerText = title;
      cardDesc.innerText = desc;
      infoCard.style.display = 'block';
    }

    function hideInfo() {
      infoCard.style.display = 'none';
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function render() {
      electronOrbits.forEach((orbit) => {
        orbit.pivot.rotation.y += 0.015 * orbit.speed;
      });

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
