<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Atom Model</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }
    #spawn-btn {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #00e5ff;
      color: #050b14;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      pointer-events: auto;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
      cursor: pointer;
    }
    #spawn-btn:active {
      transform: translateX(-50%) scale(0.95);
    }
    #info-card {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 360px;
      background: rgba(15, 15, 20, 0.95);
      backdrop-filter: blur(10px);
      color: #ffffff;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      display: none;
      pointer-events: auto;
      box-sizing: border-box;
      border: 1px solid rgba(0, 229, 255, 0.4);
    }
    #info-card h3 {
      margin: 0 0 6px 0;
      color: #00e5ff;
      font-size: 18px;
    }
    #info-card p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: #e0e0e0;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <button id="spawn-btn">⚛️ วางอะตอมตรงนี้</button>

    <div id="info-card">
      <h3 id="card-title">หัวข้อ</h3>
      <p id="card-desc">รายละเอียดข้อมูลส่วนประกอบ</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    let camera, scene, renderer;
    let atomGroup = null;
    let electronOrbits = [];
    const interactiveObjects = [];

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const spawnBtn = document.getElementById('spawn-btn');
    const infoCard = document.getElementById('info-card');
    const cardTitle = document.getElementById('card-title');
    const cardDesc = document.getElementById('card-desc');

    init();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 3.0);
      hemiLight.position.set(0, 2, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
      dirLight.position.set(1, 2, 1);
      scene.add(dirLight);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      document.body.appendChild(ARButton.createButton(renderer, {
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.getElementById('overlay') }
      }));

      // รองรับการยิงคำสั่งแตะผ่าน XR Controller โดยตรงเพื่อให้แม่นยำในโลก AR
      const controller = renderer.xr.getController(0);
      controller.addEventListener('select', onControllerSelect);
      scene.add(controller);

      spawnBtn.addEventListener('click', spawnAtomInFrontOfCamera);
      window.addEventListener('pointerdown', onScreenTap);
      window.addEventListener('resize', onWindowResize);

      renderer.setAnimationLoop(render);
    }

    function spawnAtomInFrontOfCamera(e) {
      if (e) e.stopPropagation();

      if (!atomGroup) {
        atomGroup = createAtomModel();
        scene.add(atomGroup);
      }

      // วางห่างออกไป 45 ซม. เพื่อให้ขนาดใหญ่พอดีสายตา
      const dir = new THREE.Vector3(0, 0, -0.45);
      dir.applyQuaternion(camera.quaternion);

      atomGroup.position.copy(camera.position).add(dir);
      atomGroup.quaternion.copy(camera.quaternion);

      spawnBtn.innerText = '🔄 ย้ายอะตอมมาตรงหน้า';
    }

    function createAtomModel() {
      const group = new THREE.Group();

      // 1. นิวเคลียส
      const nucleusGeo = new THREE.SphereGeometry(0.06, 32, 32);
      const nucleusMat = new THREE.MeshStandardMaterial({
        color: 0xff3b30,
        roughness: 0.3,
        metalness: 0.2
      });
      const nucleus = new THREE.Mesh(nucleusGeo, nucleusMat);
      group.add(nucleus);

      // Hitbox ขยายขนาดให้นิวเคลียส (กล่องล่องหนขนาดใหญ่ขึ้นเกือบ 2 เท่า)
      const nucleusHitbox = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 16, 16),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      nucleusHitbox.userData = {
        title: 'นิวเคลียส (Nucleus)',
        desc: 'ใจกลางของอะตอม ประกอบด้วยโปรตอน (ประจุบวก) และนิวตรอน (ไม่มีประจุ) รวมกันเป็นมวลเกือบทั้งหมด'
      };
      nucleus.add(nucleusHitbox);
      interactiveObjects.push(nucleusHitbox);

      // 2. วงโคจรและอิเล็กตรอน
      const orbitRadii = [0.14, 0.19, 0.24];
      const orbitAngles = [
        [0, 0, 0],
        [Math.PI / 3, Math.PI / 4, 0],
        [-Math.PI / 3, -Math.PI / 4, 0]
      ];

      orbitRadii.forEach((radius, i) => {
        const orbitPivot = new THREE.Group();
        orbitPivot.rotation.set(...orbitAngles[i]);

        // เส้นวงแหวน
        const ringGeo = new THREE.TorusGeometry(radius, 0.002, 16, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.5 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        orbitPivot.add(ring);

        // เม็ดอิเล็กตรอน (ทำให้เม็ดใหญ่ขึ้นเล็กน้อย)
        const electronGeo = new THREE.SphereGeometry(0.022, 16, 16);
        const electronMat = new THREE.MeshStandardMaterial({
          color: 0x00e5ff,
          emissive: 0x00e5ff,
          emissiveIntensity: 0.8
        });
        const electron = new THREE.Mesh(electronGeo, electronMat);
        electron.position.x = radius;

        // Hitbox ล่องหนของอิเล็กตรอน (ขยายใหญ่ถึง 0.06 เมตร เพื่อให้จิ้มโดนได้ง่ายแม้กำลังเคลื่อนที่)
        const electronHitbox = new THREE.Mesh(
          new THREE.SphereGeometry(0.06, 16, 16),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        electronHitbox.userData = {
          title: 'อิเล็กตรอน (Electron)',
          desc: 'อนุภาคที่มีประจุไฟฟ้าเป็นลบ โคจรรอบนิวเคลียสด้วยระดับพลังงานต่างๆ มีมวลน้อยมาก'
        };
        electron.add(electronHitbox);
        interactiveObjects.push(electronHitbox);

        orbitPivot.add(electron);
        group.add(orbitPivot);

        // ลดความเร็วในการหมุนลงเล็กน้อย เพื่อให้เอานิ้วเล็งจิ้มได้ง่ายขึ้น
        electronOrbits.push({ pivot: orbitPivot, speed: 0.8 + i * 0.4 });
      });

      return group;
    }

    // แตะผ่าน Controller ของ WebXR
    function onControllerSelect(event) {
      const tempMatrix = new THREE.Matrix4();
      tempMatrix.identity().extractRotation(event.target.matrixWorld);

      raycaster.ray.origin.setFromMatrixPosition(event.target.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

      checkIntersection();
    }

    // แตะผ่านหน้าจอมือถือ (Pointer event)
    function onScreenTap(event) {
      if (event.target.id === 'spawn-btn' || infoCard.contains(event.target)) {
        return;
      }

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      checkIntersection();
    }

    function checkIntersection() {
      const intersects = raycaster.intersectObjects(interactiveObjects, false);

      if (intersects.length > 0) {
        const item = intersects[0].object;
        showInfo(item.userData.title, item.userData.desc);
      } else {
        hideInfo();
      }
    }

    function showInfo(title, desc) {
      cardTitle.innerText = title;
      cardDesc.innerText = desc;
      infoCard.style.display = 'block';
    }

    function hideInfo() {
      infoCard.style.display = 'none';
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function render() {
      electronOrbits.forEach((orbit) => {
        orbit.pivot.rotation.y += 0.01 * orbit.speed;
      });

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
